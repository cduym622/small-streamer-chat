# Builds unsigned installers for Windows and macOS.
# - Pull requests and manual runs: installers are attached to the run as artifacts.
# - Pushing a `v*` tag: installers are attached to a draft GitHub Release for that tag.
name: Build installers

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lints and unit tests for the Rust core.
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      # Type-checks the frontend; the Rust build also needs the built `dist/`.
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-target: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only create a release for tag pushes; otherwise just upload artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Small Streamer Chat {0}', github.ref_name) || '' }}
          releaseBody: |
            Download the installer for your computer:
            - **Windows:** the `-setup.exe` file
            - **Mac with Apple Silicon (M1 or newer):** the `aarch64.dmg` file
            - **Mac with Intel:** the `x64.dmg` file

            These builds are not code-signed yet, so Windows and macOS will show a warning the first time you open them.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      # Job logs need repo access, but annotations are public: re-run a failed
      # build and post its error as an annotation so anyone can see it.
      - name: Show the build error
        if: failure()
        shell: bash
        run: |
          npm run tauri build -- ${{ matrix.args }} > build.log 2>&1 || true
          tools="$(sw_vers -productVersion 2>/dev/null) $(xcodebuild -version 2>/dev/null | head -1)"
          error=$(grep -E -B3 -A30 '^error|Error |Undefined symbols|panicked|fatal error' build.log | tail -100)
          [ -n "$error" ] || error=$(tail -60 build.log)
          error="macOS/Xcode: $tools"$'\n'"$error"
          error=${error//'%'/'%25'}
          error=${error//$'\r'/}
          error=${error//$'\n'/'%0A'}
          echo "::error title=Build error::$error"
