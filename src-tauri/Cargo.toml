[package]
name = "small-streamer-chat"
version = "0.1.0"
description = "An AI Practice Chat for small streamers"
authors = ["cduym622"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "small_streamer_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["sync", "time", "net", "macros", "fs", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
fastrand = "2.5.0"
cpal = "0.18.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json", "form"] }
sha2 = "0.11.1"
keyring = "4.2.0"
tauri-plugin-opener = "2.7.2"
getrandom = "0.4.3"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[dev-dependencies]
tauri = { version = "2", features = ["test", "tray-icon"] }
